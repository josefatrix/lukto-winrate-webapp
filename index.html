<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0E0E1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F0F1F5" media="(prefers-color-scheme: light)" />
    <meta name="description" content="LUKTO Stats - Win Rate & Ratings Tracker" />
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <title>LUKTO Stats</title>
  </head>
  <body style="margin:0;padding:0;background:#0E0E1A;">
    <noscript>
      <div style="background:#000;color:#fff;padding:40px;text-align:center;min-height:100vh;">
        <h2>JavaScript Requerido</h2>
        <p>Por favor habilita JavaScript para usar LUKTO Stats.</p>
      </div>
    </noscript>
    <div id="root">
      <div id="initial-loader">
        <p>Cargando...</p>
      </div>
    </div>
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        background: #0E0E1A;
        color: #374DF5;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 18px;
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Unregister old service workers first
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
            console.log('Unregistered old SW');
          }
        });
      }
    </script>
  </body>
</html>
